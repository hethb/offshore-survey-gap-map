[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offshore-survey-gap-map"
version = "0.1.0"
description = "Find unsurveyed gaps inside offshore lease areas and plan the survey lines that close them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
gapmap = "gapmap.cli:main"

[tool.setuptools.packages.find]
include = ["gapmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
